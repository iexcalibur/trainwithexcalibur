<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Training Week</title>
<meta name="description" content="Five-day gym week · back-conscious build. Checklist, session timer, rest timer and history.">
<meta name="theme-color" content="#0B0D11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrainWeek">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="view"></main>

<nav class="bottom-nav" id="nav">
  <button data-nav="week" class="active">
    <span class="nav-icon">◎</span><span>Overview</span>
  </button>
  <button data-nav="today">
    <span class="nav-icon">▶</span><span>Today</span>
  </button>
  <button data-nav="history">
    <span class="nav-icon">≡</span><span>History</span>
  </button>
</nav>

<div id="sheet-backdrop" hidden></div>
<section id="sheet" hidden aria-modal="true" role="dialog"></section>

<script src="plan.js"></script>
<script src="exinfo.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
